spring.application.name=SSOProject

# Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=sritam
spring.datasource.password=lion

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Port number
server.port=4041

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

#AWS Oauth2
spring.security.oauth2.client.registration.aws.client-id=${aws.client-id}
spring.security.oauth2.client.registration.aws.client-secret=${aws.client-secret}
spring.security.oauth2.client.registration.aws.scope=openid,email,phone
spring.security.oauth2.client.registration.aws.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.aws.issuer-uri=https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_dSaCHanco
spring.security.oauth2.client.provider.aws.user-name-attribute=username
spring.security.oauth2.client.provider.aws.authorization-uri=https://eu-north-1dsachanco.auth.eu-north-1.amazoncognito.com/oauth2/authorize?prompt=login