<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Manual SSO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            text-align: center;
            margin-top: 150px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .login-btn {
            display: inline-block;
            width: 180px;
            padding: 10px;
            margin: 8px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 15px;
        }

        .login-btn:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to Fragma Data</h1>

        <a class="login-btn"
           href="/oauth2/authorize/google">
            Login with Google
        </a>

        <a class="login-btn"
           href="/oauth2/authorize/github">
            Login with GitHub
        </a>

    </div>

</body>

</html>
